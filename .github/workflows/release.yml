name: Release

# Pushing a tag like v0.2.0 builds the Windows installer and publishes it
# as a GitHub release. Can also be started by hand for an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run build

      - name: Test disk scanner
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib disktree

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Sweepr v__VERSION__
          releaseBody: |
            See the [release notes](https://github.com/${{ github.repository }}/blob/v__VERSION__/CHANGELOG.md).

            Download **Sweepr___VERSION___x64-setup.exe** below and run it.
          releaseDraft: false
          prerelease: false
